spring:
  application:
    name: rapidphoto
  profiles:
    active: dev
  threads:
    virtual:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  task:
    execution:
      thread-name-prefix: async-
      pool:
        core-size: 10
        max-size: 50
        queue-capacity: 1000

server:
  port: 8080

---
# Development Profile
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:postgresql://localhost:5432/rapidphoto
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

aws:
  s3:
    bucket: rapidphoto-dev
    region: us-east-2

---
# Production Profile
spring:
  config:
    activate:
      on-profile: prod
  server:
    port: 5000
  datasource:
    url: jdbc:postgresql://${RDS_HOSTNAME}:${RDS_PORT:5432}/${RDS_DB_NAME}
    username: ${RDS_USERNAME}
    password: ${RDS_PASSWORD}
    driver-class-name: org.postgresql.Driver

aws:
  s3:
    bucket: ${S3_BUCKET}
    region: ${AWS_REGION}

