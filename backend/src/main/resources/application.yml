spring:
  application:
    name: rapidphoto
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${RDS_HOSTNAME:localhost}:${RDS_PORT:5432}/${RDS_DB_NAME:rapidphoto}
    username: ${RDS_USERNAME:postgres}
    password: ${RDS_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  task:
    execution:
      thread-name-prefix: async-
      pool:
        core-size: 10
        max-size: 50
        queue-capacity: 1000

server:
  port: 5000

aws:
  s3:
    bucket: ${S3_BUCKET:rapidphoto-dev}
    region: ${AWS_REGION:us-east-2}

